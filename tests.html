<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Neon Rhythm — testy</title>
  <style>
    body { background: #0a0a14; color: #ddd; font-family: monospace; padding: 16px; }
    .pass { color: #3dff7a; }
    .fail { color: #ff4d6d; }
    #summary { font-size: 1.5em; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Testy zasad gry</h1>
  <p id="summary"></p>
  <ul id="results"></ul>

  <script>
    // Mini-biblioteka testów: test() rejestruje test, assertEqual() sprawdza wynik.
    const tests = [];
    function test(name, fn) { tests.push({ name, fn }); }
    function assertEqual(actual, expected) {
      const a = JSON.stringify(actual);
      const e = JSON.stringify(expected);
      if (a !== e) throw new Error("oczekiwano " + e + ", otrzymano " + a);
    }

    function runTests() {
      const list = document.getElementById("results");
      let failed = 0;
      for (const t of tests) {
        const li = document.createElement("li");
        try {
          t.fn();
          li.className = "pass";
          li.textContent = "✅ " + t.name;
        } catch (err) {
          failed++;
          li.className = "fail";
          li.textContent = "❌ " + t.name + " — " + err.message;
        }
        list.appendChild(li);
      }
      const summary = document.getElementById("summary");
      summary.className = failed ? "fail" : "pass";
      summary.textContent = failed ? "FAIL " + failed + "/" + tests.length : "PASS " + tests.length + "/" + tests.length;
    }
  </script>
  <script src="rules.js"></script>
  <script src="clock.js"></script>
  <script src="tests.js"></script>
  <script>runTests();</script>
</body>
</html>
